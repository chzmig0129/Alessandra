<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alessandra · Alcaldía Cuauhtémoc</title>
    <style>
      :root {
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
        --accent: #0f766e;
        --user-bg: #0f766e;
        --user-fg: #ffffff;
        --bot-bg: #ffffff;
        --border: #e7e5e4;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
      header .controls { display: flex; gap: 8px; align-items: center; }
      header select {
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      header button {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      header button:hover { background: var(--bg); }
      header button.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      header button.error {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fecaca;
      }
      body.violeta {
        --accent: #7c3aed;
        --user-bg: #7c3aed;
      }
      .examples {
        padding: 10px 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
        background: #fff;
      }
      .examples button {
        font-size: 12px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 999px;
        cursor: pointer;
        color: var(--muted);
      }
      .examples button:hover { border-color: var(--accent); color: var(--accent); }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user-bg);
        color: var(--user-fg);
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot-bg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
        white-space: normal;
      }
      .msg.bot p { margin: 0 0 8px 0; }
      .msg.bot p:last-child { margin-bottom: 0; }
      .msg.bot ul, .msg.bot ol { margin: 4px 0 8px 20px; padding: 0; }
      .msg.bot li { margin: 2px 0; }
      .msg.bot strong { font-weight: 600; }
      .msg.bot code { background: #f5f5f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
      .msg.bot a { color: var(--accent); }
      .msg.bot.loading::after {
        content: "▍";
        opacity: 0.5;
        animation: blink 1s infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      form {
        display: flex;
        gap: 8px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: #fff;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      input[type="text"]:focus { border-color: var(--accent); }
      form button {
        padding: 10px 18px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      form button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Alessandra · Alcaldía Cuauhtémoc</h1>
      <div class="controls">
        <button id="geo" title="Comparte tu ubicación para resultados cercanos">📍 Compartir ubicación</button>
        <button id="reset">Nueva conversación</button>
      </div>
    </header>
    <div class="examples" id="examples"></div>
    <div id="chat"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="Pregúntame algo de la Cuauhtémoc o del Mundial 2026..." />
      <button type="submit" id="send">Enviar</button>
    </form>

    <script>
      const EXAMPLES = [
        "¿Cuál es el punto violeta más cercano?",
        "Cómo llego al Estadio Azteca",
        "¿Cuál es el Fan Fest más cercano?",
        "¿Cuándo juega México?",
      ];

      let threadId = crypto.randomUUID();
      const currentAgent = "alessandraAgent";
      let userLocation = null; // { lat, lng, accuracy } o null

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const reset = document.getElementById("reset");
      const geoBtn = document.getElementById("geo");
      const examplesDiv = document.getElementById("examples");

      function updateGeoBtn(state, label) {
        geoBtn.classList.remove("active", "error");
        if (state) geoBtn.classList.add(state);
        geoBtn.textContent = label;
      }

      geoBtn.addEventListener("click", () => {
        if (!("geolocation" in navigator)) {
          updateGeoBtn("error", "📍 Sin soporte");
          return;
        }
        updateGeoBtn(null, "📍 Pidiendo permiso…");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy,
            };
            updateGeoBtn("active", `📍 Activa (~${Math.round(pos.coords.accuracy)}m)`);
          },
          (err) => {
            console.warn("geolocation error:", err);
            const map = {
              1: "📍 Permiso denegado",
              2: "📍 No disponible",
              3: "📍 Tiempo agotado",
            };
            updateGeoBtn("error", map[err.code] || "📍 Error");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      });

      function renderExamples() {
        examplesDiv.innerHTML = "";
        for (const q of EXAMPLES) {
          const b = document.createElement("button");
          b.textContent = q;
          b.addEventListener("click", () => sendMessage(q));
          examplesDiv.appendChild(b);
        }
      }

      marked.setOptions({ breaks: true, gfm: true });

      function renderMarkdown(raw) {
        return DOMPurify.sanitize(marked.parse(raw));
      }

      function appendMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        if (role === "bot") {
          div.dataset.raw = text;
          div.innerHTML = text ? renderMarkdown(text) : "";
        } else {
          div.textContent = text;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      async function sendMessage(message) {
        if (!message.trim()) return;
        appendMessage("user", message);
        input.value = "";
        send.disabled = true;

        const botEl = appendMessage("bot", "");
        botEl.classList.add("loading");

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message,
              threadId,
              agent: currentAgent,
              userLocation: userLocation || undefined,
            }),
          });
          if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            // Parse SSE: bloques separados por doble newline
            let idx;
            while ((idx = buf.indexOf("\n\n")) !== -1) {
              const raw = buf.slice(0, idx);
              buf = buf.slice(idx + 2);
              const lines = raw.split("\n");
              let event = "message";
              let data = "";
              for (const line of lines) {
                if (line.startsWith("event: ")) event = line.slice(7).trim();
                else if (line.startsWith("data: ")) data += line.slice(6);
              }
              if (!data) continue;
              try {
                const payload = JSON.parse(data);
                if (event === "token" && payload.text) {
                  botEl.classList.remove("loading");
                  botEl.dataset.raw = (botEl.dataset.raw || "") + payload.text;
                  botEl.innerHTML = renderMarkdown(botEl.dataset.raw);
                  chat.scrollTop = chat.scrollHeight;
                } else if (event === "error") {
                  botEl.classList.remove("loading");
                  botEl.dataset.raw = "⚠️ " + (payload.error || "Error");
                  botEl.innerHTML = renderMarkdown(botEl.dataset.raw);
                }
              } catch {}
            }
          }
        } catch (err) {
          botEl.classList.remove("loading");
          botEl.textContent = "⚠️ " + err.message;
        } finally {
          botEl.classList.remove("loading");
          send.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        sendMessage(input.value);
      });

      reset.addEventListener("click", () => {
        threadId = crypto.randomUUID();
        chat.innerHTML = "";
        input.focus();
      });

      document.body.className = "violeta";
      renderExamples();
      input.focus();
    </script>
  </body>
</html>
